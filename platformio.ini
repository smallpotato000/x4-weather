; Xteink X4 (ESP32-C3) weather station firmware — built on the FreeInk SDK.
;
; Copy of the SDK's [base] section (platformio.sample.ini) with a single device
; target: Xteink X4, 800x480 SSD1677 panel, ESP32-C3.
;
;   pio run                 # build
;   pio run -t upload       # flash over USB-C
;   pio device monitor      # 115200 baud serial log
;
; The SDK is consumed from the sibling checkout at ../freeink-sdk. Point the
; symlink paths below at your own FreeInk SDK checkout if it lives elsewhere.

[base]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the controller's own RAM holds the previous frame.
  ; (48 KB instead of 96 KB of DRAM on the C3.)
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1

build_unflags =
  -std=gnu++11

; The Xteink X4 module is wired for DIO / 16 MB.
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Own 16 MB layout: a 4 MB application (WiFi + TLS + the UI needs more than the
; 1.3 MB default) and the rest as storage. No coredump partition, so the
; boot-time core-dump probe stays quiet (a stale OEM core-dump region otherwise
; prints "Incorrect size of core dump image" on every boot).
board_build.partitions = partitions.csv

; FreeInk libraries — the left-hand names are the include names used by the code
; (<EInkDisplay.h>, <PowerManager.h>, ...).
lib_deps =
  BoardConfig=symlink://../freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://../freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://../freeink-sdk/libs/hardware/InputManager
  PowerManager=symlink://../freeink-sdk/libs/hardware/PowerManager
  FreeInkUI=symlink://../freeink-sdk/libs/ui/FreeInkUI
  JsonSax=symlink://../freeink-sdk/libs/network/JsonSax

; Xteink X4 device flags, shared by the envs below ([base] + this = the device).
[base_x4]
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1

; --- Xteink X4 — ESP32-C3, SSD1677 800x480, ADC-ladder buttons ---------------
[env:x4weather]
extends = base
board = esp32-c3-devkitm-1
build_flags = ${base_x4.build_flags}

; --- Bring-up / verification build: refresh every minute ---------------------
; Same firmware with a 1-minute deep-sleep interval, so a full sleep → timer
; wake → fetch → paint cycle can be watched in a couple of minutes instead of
; half an hour. The refresh interval and the failure retry are overridable
; because config.h guards them with #ifndef.
;   pio run -e x4weather_1min -t upload && pio device monitor
[env:x4weather_1min]
extends = base
board = esp32-c3-devkitm-1
build_flags =
  ${base_x4.build_flags}
  -DWEATHER_REFRESH_MINUTES=1
  -DWEATHER_RETRY_MINUTES=1
