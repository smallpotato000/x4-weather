; Xteink X4 (ESP32-C3) weather station firmware — built on the FreeInk SDK.
;
; Copy of the SDK's [base] section (platformio.sample.ini) with a single device
; target: Xteink X4, 800x480 SSD1677 panel, ESP32-C3.
;
;   pio run                 # build
;   pio run -t upload       # flash over USB-C
;   pio device monitor      # 115200 baud serial log
;
; The SDK is consumed from the sibling checkout at ../freeink-sdk. Point the
; symlink paths below at your own FreeInk SDK checkout if it lives elsewhere.

[base]
; pioarduino Arduino-ESP32 platform (Arduino core 3.3.x / ESP-IDF 5.5.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer: the controller's own RAM holds the previous frame.
  ; (48 KB instead of 96 KB of DRAM on the C3.)
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1

build_unflags =
  -std=gnu++11

; The Xteink X4 module is wired for DIO / 16 MB.
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Own 16 MB layout: a 4 MB application (WiFi + TLS + the UI needs more than the
; 1.3 MB default) and the rest as storage. No coredump partition, so the
; boot-time core-dump probe stays quiet (a stale OEM core-dump region otherwise
; prints "Incorrect size of core dump image" on every boot).
board_build.partitions = partitions.csv

; PlatformIO auto-detects the *first* /dev/cu.* device, which on a Mac with
; Bluetooth audio is a headset endpoint — so the upload fails against the wrong
; port while the board sits on /dev/cu.usbmodemXXXX. This pre-hook pins the
; uploader to the ESP32's USB-CDC port (and stays out of the way when the port
; is given explicitly, or when the board is deeply asleep and has no node).
extra_scripts = pre:tools/pio_upload_port.py

; FreeInk libraries — the left-hand names are the include names used by the code
; (<EInkDisplay.h>, <PowerManager.h>, ...).
lib_deps =
  BatteryMonitor=symlink://../freeink-sdk/libs/hardware/BatteryMonitor
  BoardConfig=symlink://../freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://../freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://../freeink-sdk/libs/hardware/InputManager
  PowerManager=symlink://../freeink-sdk/libs/hardware/PowerManager
  FreeInkUI=symlink://../freeink-sdk/libs/ui/FreeInkUI
  JsonSax=symlink://../freeink-sdk/libs/network/JsonSax

; Xteink X4 device flags, shared by the envs below ([base] + this = the device).
[base_x4]
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1

; --- Xteink X4 — ESP32-C3, SSD1677 800x480, ADC-ladder buttons ---------------
[env:x4weather]
extends = base
board = esp32-c3-devkitm-1
build_flags = ${base_x4.build_flags}
build_src_filter = +<*> -<bringup_main.cpp>

; --- Bring-up / verification build: refresh every minute ---------------------
; Same firmware with a 1-minute deep-sleep interval, so a full sleep → timer
; wake → fetch → paint cycle can be watched in a couple of minutes instead of
; half an hour. The refresh interval and the failure retry are overridable
; because config.h guards them with #ifndef.
;   pio run -e x4weather_1min -t upload && pio device monitor
[env:x4weather_1min]
extends = base
board = esp32-c3-devkitm-1
build_flags =
  ${base_x4.build_flags}
  -DWEATHER_REFRESH_MINUTES=1
  -DWEATHER_RETRY_MINUTES=1
build_src_filter = +<*> -<bringup_main.cpp>

; =============================================================================
; M5Stack PaperS3 — ESP32-S3R8, ED047TC1 960x540 (8-bit parallel EPD, 16 gray),
; GT911 touch, no GPIO buttons at all (navigation is touch-only), ADC battery on
; GPIO3, BM8563 RTC. The panel needs OPI PSRAM and the LGFX EPD driver from
; M5GFX; FREEINK_DEVICE_PAPERS3 selects m5PaperS3LgfxConfig() automatically.
; =============================================================================
[base_papers3]
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
  ${base.build_flags}
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_PAPERS3=1
lib_deps =
  ${base.lib_deps}
  BoardPaperS3=symlink://../freeink-sdk/libs/hardware/BoardPaperS3
  m5stack/M5GFX @ 0.2.33

; --- The weather app on PaperS3 --------------------------------------------
[env:papers3]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags = ${base_papers3.build_flags}
lib_deps = ${base_papers3.lib_deps}
build_src_filter = +<*> -<bringup_main.cpp>

; --- Bench build: long touch window + 2-minute refresh ----------------------
; Same app, but the touch session stays open for five minutes and the cycle
; repeats every two, so the touch interaction can be exercised without waiting
; for a 30-minute wake.
;   pio run -e papers3_bench -t upload
[env:papers3_bench]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
  ${base_papers3.build_flags}
  -DWEATHER_TOUCH_SESSION_MS=1800000
  -DWEATHER_REFRESH_MINUTES=2
  -DWEATHER_RETRY_MINUTES=1
lib_deps = ${base_papers3.lib_deps}
build_src_filter = +<*> -<bringup_main.cpp>

; --- Bring-up / calibration firmware ---------------------------------------
; Verifies the three facts the SDK marks "pending hardware validation" (panel
; rotation, GT911 flip/swap axes, battery divider) plus refresh timings and the
; touch pipeline, on real hardware. Talks over the native USB CDC serial.
[env:papers3_bringup]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags = ${base_papers3.build_flags}
lib_deps = ${base_papers3.lib_deps}
build_src_filter = +<*> -<main.cpp>
